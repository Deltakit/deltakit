---
name: Link Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  schedule:
    # Run weekly on Mondays at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link-check:
    name: Check Links
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install lychee
        uses: lycheeverse/lychee-action@v2
        with:
          version: "0.16.0"
          args: >
            --config .lychee.toml
            --fail
          fail: true

      - name: Run lychee and capture output
        if: always()
        run: |
          lychee --config .lychee.toml . > lychee-output.txt 2>&1 || true

      - name: Comment on PR with link check results
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('lychee-output.txt', 'utf8');
            
            const body = `## 🔗 Link Check Failed
            
            The link check found broken links. Please review the output below:
            
            \`\`\`
            ${output}
            \`\`\`
            
            *This check runs on every PR and weekly on Mondays.*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true