[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "deltakit-core"
version = "0.5.1"
description = "Deltakit (component deltakit-core)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]

authors = [{ name = "Deltakit Team", email = "deltakit@riverlane.com" }]

classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Quantum Computing",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26",
  "numpy>=2.1; python_version >= '3.13'",
  "networkx>=3.1",
  "stim>=1.12.1",
  "typing_extensions>=4.0",
  "semver>=3",
]

[dependency-groups]
test = [
  "pytest>=8.4",
  "pytest-cov>=7",
  "pytest-mock>=3.14",
  "pytest-skip-slow>=0.0.5",
  "pytest-lazy-fixtures>=1.0",
]
lint = [
  "mypy>=1.17",
  "ruff>=0.14",
  "typos>=1.34",
  "deptry>=0.23",
  "types-networkx>=3.1",
]
security = ["bandit>=1.8.6", "ochrona>=2.0.2", "pip-audit>=2.7.3"]
dev = [
  { include-group = "test" },
  { include-group = "lint" },
  { include-group = "security" },
]

[project.urls]
Homepage = "https://github.com/Deltakit/deltakit"
"Bug Tracker" = "https://github.com/Deltakit/deltakit/issues"
Changelog = "https://github.com/Deltakit/deltakit/releases"

[tool.mypy]
files = "src/**/*.py"
# The below list of disabled checks should eventually be empty.
disable_error_code = "arg-type,attr-defined"

[[tool.mypy.overrides]]
module = ["stim"]
follow_untyped_imports = true
